[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="structural-cad-analysis-toolkit"
version="0.1.0"
description="Python toolkit for CAD-to-structural modelling, matrix stiffness analysis, wall modelling and mesh generation"
requires-python=">=3.10"
dependencies=["numpy","pandas","plotly","ezdxf","gmsh"]
[tool.pytest.ini_options]
pythonpath=[".", "src"]
